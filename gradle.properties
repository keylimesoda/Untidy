org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Use the plain detekt task for Android modules so a single detekt-baseline.xml
# per module can grandfather existing findings (the experimental variant-aware
# tasks expect per-variant baseline files).
detekt.android.disabled=true
