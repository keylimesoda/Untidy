name: Publish signed Wear OS APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
      ANDROID_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
      TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
      TIDAL_REDIRECT_URI: ${{ secrets.TIDAL_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Validate signing and TIDAL secrets
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app versionName $app_version" >&2; exit 1
          fi
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD TIDAL_CLIENT_ID TIDAL_CLIENT_SECRET TIDAL_REDIRECT_URI; do
            if [[ -z "${!name:-}" ]]; then echo "Missing GitHub Actions secret for $name" >&2; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          chmod 600 "$ANDROID_KEYSTORE_FILE"
          mkdir -p .dev-secrets
          {
            printf 'tidal.clientid=%s\n' "$TIDAL_CLIENT_ID"
            printf 'tidal.clientsecret=%s\n' "$TIDAL_CLIENT_SECRET"
            printf 'tidal.redirecturi=%s\n' "$TIDAL_REDIRECT_URI"
          } > .dev-secrets/tidal-app.properties
          chmod 600 .dev-secrets/tidal-app.properties
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signature and create checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mv "$APK" "Untidy-${GITHUB_REF_NAME}.apk"
          sha256sum "Untidy-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Untidy ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            Untidy-${{ github.ref_name }}.apk
            SHA256SUMS.txt
