name: APK publication paused

# Keep this path so the retired publishing workflow is visibly replaced.
# Repository owners must also disable it in Actions to block historical refs.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  publication-paused:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject publication
        run: |
          echo '::error::Untidy publication is paused pending TIDAL authorization and release-policy review. See docs/releasing.md.'
          exit 1
